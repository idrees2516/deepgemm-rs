[package]
name = "deepgemm-bench"
description = "Benchmark CLI for deepgemm (TFLOPS, % of peak, tiling overrides)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "deepgemm-bench"
path = "src/main.rs"

[dependencies]
deepgemm = { path = "../deepgemm" }
clap = { version = "4", features = ["derive"] }
